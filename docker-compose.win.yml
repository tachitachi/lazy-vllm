services:
  # NOTE: node-exporter is NOT included here. Windows host metrics are collected
  # by prometheus-community/windows_exporter running as a native Windows service.
  # See scripts/install-windows-exporter.ps1 for installation instructions.
  #
  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.4.1
    ports:
      - "9835:9835"
    healthcheck:
      test: ["CMD", "nvidia-smi"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
