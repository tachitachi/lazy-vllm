services:
  gemma4:
    # image: vllm/vllm-openai:nightly-1acd67a795ebccdf9b9db7697ae9082058301657
    build:
      context: .
      dockerfile: Dockerfile.gemma4
    ports:
      - "8001:8000"
    ipc: host
    shm_size: '16g'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      # - ${HOME}/.cache/huggingface/hub/models--google--gemma-4-26B-A4B-it/snapshots/4c55b528bdc40b4e79ed7fd4e2f8e46fa5aaed5a/chat_template.jinja:/vllm-workspace/examples/tool_chat_template_gemma4.jinja
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
    command:
      - --model=RedHatAI/gemma-4-26B-A4B-it-NVFP4
      - --served-model-name
      - google/gemma-4-26B-A4B-it
      - RedHatAI/gemma-4-26B-A4B-it-NVFP4
      - gemma-4-26B-A4B-it
      - --max-model-len=262144
      - --gpu-memory-utilization=0.40
      # - --quantization=fp8
      - --kv-cache-dtype=fp8
      - --host=0.0.0.0
      - --port=8000
      - --async-scheduling
      - --enable-auto-tool-choice
      - --reasoning-parser=gemma4
      - --tool-call-parser=gemma4
      - --chat-template=examples/tool_chat_template_gemma4.jinja
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-seqs=64
      - --max-num-batched-tokens=8192
      - '--default-chat-template-kwargs={"enable_thinking": true}'
      # - '--speculative-config={"model": "google/gemma-4-26B-A4B-it-assistant", "num_speculative_tokens": 6}'
      - --mm-processor-cache-type=lru
      - --mm-processor-cache-gb=8
    profiles:
      - gemma4
      - all
    depends_on:
      qwen36:
        condition: service_healthy

  qwen36:
    image: vllm/vllm-openai:nightly-1acd67a795ebccdf9b9db7697ae9082058301657
    ports:
      - "8000:8000"
    ipc: host
    shm_size: '16g'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
    command:
      - --model=RedHatAI/Qwen3.6-35B-A3B-NVFP4
      - --served-model-name
      - RedHatAI/Qwen3.6-35B-A3B-NVFP4
      - Qwen3.6-35B-A3B-NVFP4
      - --max-model-len=262144
      - --gpu-memory-utilization=0.40
      - --kv-cache-dtype=fp8
      - --host=0.0.0.0
      - --port=8000
      - --async-scheduling
      - --enable-auto-tool-choice
      - --reasoning-parser=qwen3
      - --tool-call-parser=qwen3_coder
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-seqs=192
      - --max-num-batched-tokens=8192
      - '--default-chat-template-kwargs={"preserve_thinking": true, "enable_thinking": true}'
      # - '--speculative-config={"method":"mtp","num_speculative_tokens":6}'
      - --mm-processor-cache-type=lru
      - --mm-processor-cache-gb=8
    profiles:
      - qwen36
      - all

  # thinking-router:
  #   build:
  #     context: ./router
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8001:8001"
  #   environment:
  #     - VLLM_BASE_URL=http://gemma4:8000
  #     - PORT=8001
  #     - ROUTER_WINDOW_SIZE=3
  #     - MODEL_NAME=google/gemma-4-26B-A4B-it
  #   restart: always

  agent-graph:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - VLLM_BASE_URL=http://qwen36:8000
      - PORT=8002
      - ROUTER_WINDOW_SIZE=3
      - MODEL_NAME=RedHatAI/Qwen3.6-35B-A3B-NVFP4
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/logs
    volumes:
      - ./agent-logs:/logs
    restart: always

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://agent-graph:8002/v1
    volumes:
      - open-webui:/app/backend/data
    restart: always

  node-exporter:
    image: prom/node-exporter:latest
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    restart: always

  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.4.1
    ports:
      - "9835:9835"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: always

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards/json:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: always

