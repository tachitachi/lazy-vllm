services:
  gemma4:
    image: vllm/vllm-openai:gemma4-0505-cu130
    ports:
      - "8000:8000"
    ipc: host
    shm_size: '16g'
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/.cache/huggingface/hub/models--google--gemma-4-26B-A4B-it/snapshots/4c55b528bdc40b4e79ed7fd4e2f8e46fa5aaed5a/chat_template.jinja:/vllm-workspace/examples/tool_chat_template_gemma4.jinja
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
    command:
      - --model=google/gemma-4-26B-A4B-it
      - --served-model-name
      - google/gemma-4-26B-A4B-it
      - gemma-4-26B-A4B-it
      - --max-model-len=262144
      - --gpu-memory-utilization=0.50
      - --quantization=fp8
      - --kv-cache-dtype=fp8
      - --host=0.0.0.0
      - --port=8000
      - --async-scheduling
      - --enable-auto-tool-choice
      - --reasoning-parser=gemma4
      - --tool-call-parser=gemma4
      - --chat-template=examples/tool_chat_template_gemma4.jinja
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-seqs=256
      - --max-num-batched-tokens=8192
      - '--default-chat-template-kwargs={"enable_thinking": true}'
      - '--speculative-config={"model": "google/gemma-4-26B-A4B-it-assistant", "num_speculative_tokens": 6}'
      - --mm-processor-cache-type=lru
      - --mm-processor-cache-gb=8

  thinking-router:
    build:
      context: ./router
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - VLLM_BASE_URL=http://gemma4:8000
      - PORT=8001
      - ROUTER_WINDOW_SIZE=3
      - MODEL_NAME=google/gemma-4-26B-A4B-it
    depends_on:
      - gemma4
    restart: always

  agent-graph:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - VLLM_BASE_URL=http://gemma4:8000
      - PORT=8002
      - ROUTER_WINDOW_SIZE=3
      - MODEL_NAME=google/gemma-4-26B-A4B-it
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - gemma4
    restart: always

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://thinking-router:8001/v1
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - thinking-router
    restart: always

  node-exporter:
    image: prom/node-exporter:latest
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    restart: always

  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.4.1
    ports:
      - "9835:9835"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: always

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards/json:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: always

  opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "4096:4096"
    volumes:
      - ${WORKSPACE_PATH:-${HOME}/GitHub}:/workspace
      - ./opencode/data:/home/opencode
      - ./opencode/opencode.json:/home/opencode/.config/opencode/opencode.json:ro
    environment:
      HOME: /home/opencode
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      VLLM_API_KEY: EMPTY
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      - gemma4
    restart: unless-stopped

volumes:
  open-webui:
  prometheus-data:
  grafana-data:
