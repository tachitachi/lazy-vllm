  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    extra_hosts:
      - "fast-qwen:${FAST_QWEN_IP}"
    environment:
      THINKING_BUDGET: 0.5
      ENABLE_SYSTEM_REMINDER: true
      BACKENDS_MAP: >-
        [
          {"name":"Qwen3.6-27B-Text-NVFP4-MTP","url":"http://fast-qwen:8000","count_tokens":true}
        ]
      PROVIDERS_MAP: >-
        [
          {"name":"anthropic","url":"https://api.anthropic.com","count_tokens":false}
        ]
      # ROUTING_RULES: >-
      #   [
      #     {"source_model":"RedHatAI/Qwen3.6-35B-A3B-NVFP4","threshold":240000,"target_model":"RedHatAI/Qwen3.6-35B-A3B-NVFP4-1M"},
      #     {"source_model":"Qwen3.6-35B-A3B-NVFP4","threshold":240000,"target_model":"Qwen3.6-35B-A3B-NVFP4-1M"},
      #     {"source_model":"sakamakismile/Qwen3.6-27B-Text-NVFP4-MTP","threshold":240000,"target_model":"Qwen3.6-35B-A3B-NVFP4-1M"},
      #     {"source_model":"Qwen3.6-27B-Text-NVFP4-MTP","threshold":240000,"target_model":"Qwen3.6-35B-A3B-NVFP4-1M"}
      #   ]
      # BACKENDS_MAP: >-
      #   [
      #     {"name":"RedHatAI/Qwen3.6","url":"http://qwen36:8000","count_tokens":true},
      #     {"name":"Qwen3.6","url":"http://qwen36:8000","count_tokens":true},
      #     {"name":"google","url":"http://gemma4:8000","count_tokens":true},
      #     {"name":"RedHatAI/gemma","url":"http://gemma4:8000","count_tokens":true},
      #     {"name":"gemma","url":"http://gemma4:8000","count_tokens":true}
      #   ]
      PORT: "8002"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /logs
      MEMORY_INGEST_URL: http://memory:8020
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./agent-logs:/logs
    restart: always

  memory:
    build:
      context: ./memory
      dockerfile: Dockerfile
    ports:
      - "8020:8020"
    environment:
      CHROMA_PATH: /data
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./chroma-data:/data
    restart: always

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://proxy:8002/v1
    volumes:
      - open-webui:/app/backend/data
    restart: always

  node-exporter:
    image: prom/node-exporter:latest
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    restart: always

  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.4.1
    ports:
      - "9835:9835"
    healthcheck:
      test: ["CMD", "nvidia-smi"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: always

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "fast-qwen:${FAST_QWEN_IP}"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards/json:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: always

