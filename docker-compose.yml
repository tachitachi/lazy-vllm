services:
  gemma4:
    image: vllm/vllm-openai:nightly-22a58640b4563f5945aa2052e9e61d425351588d
    # build:
    #   context: .
    #   dockerfile: Dockerfile.gemma4
    ports:
      - "8001:8000"
    ipc: host
    shm_size: '16g'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      # - ${HOME}/.cache/huggingface/hub/models--google--gemma-4-26B-A4B-it/snapshots/4c55b528bdc40b4e79ed7fd4e2f8e46fa5aaed5a/chat_template.jinja:/vllm-workspace/examples/tool_chat_template_gemma4.jinja
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
    command:
      - --model=RedHatAI/gemma-4-26B-A4B-it-NVFP4
      - --served-model-name=gemma-4-26B-A4B-it
      - --max-model-len=262144
      - --gpu-memory-utilization=0.40
      # - --quantization=fp8
      - --kv-cache-dtype=fp8
      - --host=0.0.0.0
      - --port=8000
      - --async-scheduling
      - --enable-auto-tool-choice
      - --reasoning-parser=gemma4
      - --tool-call-parser=gemma4
      - --chat-template=examples/tool_chat_template_gemma4.jinja
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-seqs=64
      - --max-num-batched-tokens=8192
      - '--default-chat-template-kwargs={"enable_thinking": true}'
      - '--speculative-config={"model": "google/gemma-4-26B-A4B-it-assistant", "num_speculative_tokens": 3}'
      - --mm-processor-cache-type=lru
      - --mm-processor-cache-gb=8
    profiles:
      - gemma4

  qwen36:
    image: vllm/vllm-openai:nightly-1acd67a795ebccdf9b9db7697ae9082058301657
    ports:
      - "8000:8000"
    ipc: host
    shm_size: '16g'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
    command:
      - --model=RedHatAI/Qwen3.6-35B-A3B-NVFP4
      - --served-model-name
      - RedHatAI/Qwen3.6-35B-A3B-NVFP4
      - Qwen3.6-35B-A3B-NVFP4
      - --max-model-len=262144
      - --gpu-memory-utilization=0.40
      - --kv-cache-dtype=fp8
      - --host=0.0.0.0
      - --port=8000
      - --async-scheduling
      - --enable-auto-tool-choice
      - --reasoning-parser=qwen3
      - --tool-call-parser=qwen3_coder
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-seqs=8
      - --max-num-batched-tokens=8192
      - '--default-chat-template-kwargs={"preserve_thinking": true, "enable_thinking": true}'
      - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'
      - --mm-processor-cache-type=lru
      - --mm-processor-cache-gb=8
    profiles:
      - qwen36
      - all

  qwen36-1m:
    image: vllm/vllm-openai:nightly-1acd67a795ebccdf9b9db7697ae9082058301657
    ports:
      - "8001:8000"
    ipc: host
    shm_size: '16g'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
    command:
      - --model=RedHatAI/Qwen3.6-35B-A3B-NVFP4
      - --served-model-name
      - RedHatAI/Qwen3.6-35B-A3B-NVFP4-1M
      - Qwen3.6-35B-A3B-NVFP4-1M
      - --gpu-memory-utilization=0.40
      - --kv-cache-dtype=fp8
      - --host=0.0.0.0
      - --port=8000
      - --async-scheduling
      - --enable-auto-tool-choice
      - --reasoning-parser=qwen3
      - --tool-call-parser=qwen3_coder
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-seqs=16
      - --max-num-batched-tokens=32768
      - '--default-chat-template-kwargs={"preserve_thinking": true, "enable_thinking": true}'
      # - '--speculative-config={"method":"mtp","num_speculative_tokens":6}'
      - --mm-processor-cache-type=lru
      - '--hf-overrides={"text_config": {"rope_parameters": {"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": 4.0, "original_max_position_embeddings": 262144}}}'
      - --max-model-len=1010000
    profiles:
      - qwen36-1m
      - all
    depends_on:
      qwen36:
        condition: service_healthy

  qwen36-27b:
    image: vllm/vllm-openai:nightly-1acd67a795ebccdf9b9db7697ae9082058301657
    ports:
      - "8003:8000"
    ipc: host
    shm_size: '16g'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
    command:
      - --model=sakamakismile/Qwen3.6-27B-Text-NVFP4-MTP
      - --served-model-name=Qwen3.6-27B-Text-NVFP4-MTP
      - --max-model-len=262144
      - --gpu-memory-utilization=0.40
      - --kv-cache-dtype=fp8
      - --host=0.0.0.0
      - --port=8000
      - --async-scheduling
      - --enable-auto-tool-choice
      - --reasoning-parser=qwen3
      - --tool-call-parser=qwen3_coder
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-seqs=16
      - --max-num-batched-tokens=8192
      - '--default-chat-template-kwargs={"preserve_thinking": true, "enable_thinking": true}'
      - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'
      - --quantization=modelopt
      - --language-model-only
    profiles:
      - qwen36-27b

