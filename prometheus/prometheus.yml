global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ['qwen36:8000', 'qwen36-1m:8000', 'qwen36-27b:8000', 'gemma4:8000', 'fast-qwen:8000']

  - job_name: node
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          host: linux-server
      - targets: ['fast-qwen:9182']
        labels:
          host: fast-qwen

  - job_name: nvidia_gpu
    static_configs:
      - targets: ['nvidia-gpu-exporter:9835']
        labels:
          host: linux-server
      - targets: ['fast-qwen:9835']
        labels:
          host: fast-qwen

  - job_name: hwmon
    static_configs:
      - targets: ['fast-qwen:4445']
        labels:
          host: fast-qwen

  - job_name: coretemp
    static_configs:
      - targets: ['fast-qwen:9184']
        labels:
          host: fast-qwen

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: agent_graph
    static_configs:
      - targets: ['agent-graph:8002']
