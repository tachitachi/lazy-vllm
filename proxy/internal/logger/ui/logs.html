<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.3/lib/marked.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.2/dist/purify.min.js" defer></script>
  <style>
    .role-system   { background:#374151; color:#d1d5db; }
    .role-user     { background:#1e40af; color:#bfdbfe; }
    .role-assistant{ background:#065f46; color:#6ee7b7; }
    .role-tool     { background:#78350f; color:#fde68a; }
    .json-block    { white-space:pre-wrap; word-break:break-all; font-family:monospace; font-size:0.75rem; }
    .reasoning-block { border-left:3px solid #6366f1; padding-left:0.75rem; color:#a5b4fc; font-style:italic; }
    details > summary { cursor:pointer; user-select:none; }
    details > summary::-webkit-details-marker { display:none; }
    /* dark-mode markdown styling */
    .md-content   { color:#e5e7eb; font-size:0.875rem; line-height:1.7; }
    .md-content p { margin:0.25rem 0; }
    .md-content code { background:#1f2937; padding:0.1rem 0.3rem; border-radius:4px; font-size:0.8rem; font-family:ui-monospace,monospace; }
    .md-content pre { background:#1f2937; padding:0.75rem 1rem; border-radius:6px; overflow-x:auto; }
    .md-content pre code { background:transparent; padding:0; font-size:0.75rem; color:#e5e7eb; }
    .md-content table { border-collapse:collapse; }
    .md-content th, .md-content td { border:1px solid #374151; padding:0.3rem 0.6rem; }
    .md-content th { background:#1f2937; font-weight:600; }
    .md-content blockquote { border-left:3px solid #4b5563; padding-left:0.75rem; color:#9ca3af; }
    .md-content a { color:#60a5fa; text-decoration:underline; }
    .md-content h1,.md-content h2,.md-content h3,.md-content h4 { color:#f9fafb; margin:0.5rem 0 0.25rem; font-weight:600; }
    .md-content hr { border-color:#374151; margin:0.5rem 0; }
    .md-content ul,.md-content ol { padding-left:1.5rem; margin:0.25rem 0; }
    .md-content li { margin:0.1rem 0; }
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        z-index: 50;
        box-shadow: 2px 0 8px rgba(0,0,0,0.5);
        transition: width 0.2s ease-in-out;
      }
      #mobile-overlay {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(0,0,0,0.5);
        display: none;
      }
      #mobile-overlay.visible {
        display: block;
      }
    }
    #scroll-to-top {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 50;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }
    #scroll-to-top.visible {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-200 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-gray-900 border-b border-gray-700 px-5 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <button id="sidebar-toggle" class="text-gray-400 hover:text-white text-xl" onclick="toggleSidebar()" aria-label="Toggle sidebar">☰</button>
      <span class="text-lg font-semibold text-white">Agent Logs</span>
      <span id="status-dot" class="w-2 h-2 rounded-full bg-gray-500"></span>
    </div>
    <div class="flex items-center gap-3 flex-wrap">
<label class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer">
        <input type="checkbox" id="auto-refresh" class="accent-indigo-500"> Auto-refresh
      </label>
      <button id="refresh-btn" class="text-sm bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded border border-gray-600">
        ↻ Refresh
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex flex-1 min-h-0">

    <!-- Left: list (collapsible, overlay on mobile) -->
    <aside id="sidebar" class="w-72 shrink-0 border-r border-gray-700 bg-gray-900 flex flex-col transition-all duration-200 ease-in-out overflow-hidden" style="width:18rem; min-width:18rem;">
      <div class="px-3 py-2 text-xs text-gray-500 border-b border-gray-700 font-medium uppercase tracking-wide" id="list-header">Sessions</div>
      <div id="request-list" class="overflow-y-auto flex-1"></div>
    </aside>

    <!-- Right: detail -->
    <section class="flex-1 overflow-y-auto p-3 md:p-6 bg-gray-950 min-w-0" id="detail-panel">
      <div class="text-gray-500 text-center mt-32 text-sm">Select an item from the list to inspect it.</div>
    </section>

  </main>

  <!-- Mobile overlay (shown when sidebar is open on mobile) -->
  <div id="mobile-overlay" onclick="closeSidebar()"></div>

  <!-- Scroll to top button -->
  <button id="scroll-to-top" class="bg-gray-800 hover:bg-gray-700 text-gray-300 p-2 rounded-full shadow-lg border border-gray-600" onclick="scrollToTop()" aria-label="Scroll to top">↑</button>

<script>
let selectedId = null;
let allSessions = [];
let refreshTimer = null;

// ── Markdown renderer ────────────────────────────────────────

let _renderMarkdownFn = null;

function renderMarkdown(text) {
  if (!_renderMarkdownFn) {
    if (typeof marked === 'undefined') {
      _renderMarkdownFn = function(t) { return t ? '<p class="text-sm text-gray-300 mt-1 whitespace-pre-wrap break-words">' + escHtml(t) + '</p>' : ''; };
    } else {
      marked.setOptions({ breaks: true, gfm: true, headerIds: false });
      var sanitizer = typeof DOMPurify !== 'undefined' ? DOMPurify : null;
      _renderMarkdownFn = function(text) {
        if (!text) return '';
        var raw = marked.parse(String(text));
        try { return sanitizer ? sanitizer.sanitize(raw) : raw; } catch { return raw; }
      };
    }
  }
  return _renderMarkdownFn(text);
}

// ── Sidebar toggle ───────────────────────────────────────────

let sidebarOpen = !window.matchMedia('(max-width: 768px)').matches;

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('mobile-overlay');
  sidebarOpen = !sidebarOpen;
  if (sidebarOpen) {
    sidebar.style.width = '18rem';
    sidebar.style.minWidth = '18rem';
    if (window.matchMedia('(max-width: 768px)').matches) {
      overlay.classList.add('visible');
    }
  } else {
    sidebar.style.width = '0';
    sidebar.style.minWidth = '0';
    if (window.matchMedia('(max-width: 768px)').matches) {
      overlay.classList.remove('visible');
    }
  }
  sidebar.style.overflow = 'hidden';
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('mobile-overlay');
  sidebarOpen = false;
  sidebar.style.width = '0';
  sidebar.style.minWidth = '0';
  overlay.classList.remove('visible');
}

// Initialize sidebar state based on screen size
(function() {
  if (!sidebarOpen) {
    document.getElementById('sidebar').style.width = '0';
    document.getElementById('sidebar').style.minWidth = '0';
  }
})();

// Close sidebar when clicking outside on mobile
window.addEventListener('resize', function() {
  if (window.matchMedia('(max-width: 768px)').matches) {
    sidebarOpen = false;
    document.getElementById('sidebar').style.width = '0';
    document.getElementById('sidebar').style.minWidth = '0';
  }
});

// ── Fetch helpers ────────────────────────────────────────────

async function fetchSessionsList() {
  const res = await fetch('/api/sessions');
  if (!res.ok) throw new Error('fetch sessions list failed');
  return res.json();
}

async function fetchSessionDetail(id) {
  const res = await fetch(`/api/sessions/${id}`);
  if (!res.ok) throw new Error('fetch session detail failed');
  return res.json();
}

async function fetchRawRequest(id) {
  const res = await fetch(`/api/sessions/${id}/raw`);
  if (!res.ok) return null;
  return res.json();
}

function buildCurlCommand(raw) {
  const baseURL = window.location.protocol + '//' + window.location.host;
  const lines = [`curl -X POST '${baseURL}${escHtml(raw.path)}'`];
  const headers = raw.headers || {};
  for (const [k, v] of Object.entries(headers)) {
    lines.push(`  -H '${k}: ${v}'`);
  }
  lines.push(`  -H 'Content-Type: application/json'`);
  let body = raw.body || '';
  try { body = JSON.stringify(JSON.parse(body), null, 2); } catch {}
  // Escape single quotes for shell safety
  const escapedBody = body.replace(/'/g, "'\\''");
  lines.push(`  -d '${escapedBody}'`);
  return lines.join(' \\\n');
}

// ── Rendering ────────────────────────────────────────────────

function fmtDuration(ms) {
  if (ms < 1000) return `${ms}ms`;
  return `${(ms / 1000).toFixed(1)}s`;
}

function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' ' + fmtTime(iso);
}

function roleBadge(role) {
  const cls = `role-${role}`;
  return `<span class="inline-block text-xs font-mono px-2 py-0.5 rounded ${cls}">${role}</span>`;
}

function renderContent(content, enableMarkdown) {
  if (content === null || content === undefined || content === '') return '';
  if (typeof content === 'string') {
    const renderedContent = enableMarkdown === true ? renderMarkdown(escHtml(content)) : escHtml(content);
    return `<div class="md-content whitespace-pre-wrap test-foo">${renderedContent}</div>`;
  }
  if (Array.isArray(content)) {
    return content.map(b => {
      if (b.type === 'text') {
        const renderedContent = enableMarkdown === true ? renderMarkdown(escHtml(b.text) || '') : escHtml(b.text) || '';
        return `<div class="md-content whitespace-pre-wrap test-bar">${renderedContent}</div>`
      };
      return `<p class="text-xs text-gray-500 mt-1">[${b.type}]</p>`;
    }).join('');
  }
  return `<pre class="json-block text-gray-400 mt-1">${escHtml(JSON.stringify(content, null, 2))}</pre>`;
}

function renderToolCalls(toolCalls) {
  if (!toolCalls || toolCalls.length === 0) return '';
  return toolCalls.map(tc => {
    let args = tc.function?.arguments || '';
    try { args = JSON.stringify(JSON.parse(args), null, 2); } catch {}
    const idLabel = tc.id ? `<span class="text-gray-600 font-mono ml-2">${escHtml(tc.id)}</span>` : '';
    return `
      <div class="mt-1 bg-gray-800 rounded p-2 border border-amber-800/40">
        <div class="flex items-center gap-1 text-xs font-mono text-amber-400">⚙ ${escHtml(tc.function?.name || '')}${idLabel}</div>
        <pre class="json-block text-gray-400 mt-1">${escHtml(args)}</pre>
      </div>`;
  }).join('');
}

function renderMessage(msg) {
  const role = msg.role || 'unknown';
  const enableMarkdown = role !== 'tool';

  let inner = '';
  if (msg.reasoning) {
    inner += `<div class="reasoning-block text-xs mt-1 mb-2">
      <div class="text-indigo-400 text-xs font-semibold mb-1">Reasoning</div>
      <div class="whitespace-pre-wrap break-words">${renderMarkdown(msg.reasoning, enableMarkdown)}</div>
    </div>`;
  }
  inner += renderContent(msg.content, enableMarkdown);
  inner += renderToolCalls(msg.tool_calls);
  inner = inner.trim();

  let preview = '';
  if (inner) {
    const tmp = document.createElement('div');
    tmp.innerHTML = inner;
    const text = (tmp.textContent || '').replace(/\s+/g, ' ').trim();
    preview = text.slice(0, 250);
    if (text.length > 250) preview += '…';
  }

  let html = `<div class="mb-3 p-3 bg-gray-800/60 rounded border border-gray-700">`;
  html += `<div class="flex items-center gap-2 mb-1">${roleBadge(role)}`;
  if (msg.name) html += `<span class="text-xs text-gray-500 font-mono">${escHtml(msg.name)}</span>`;
  if (msg.tool_call_id) html += `<span class="text-xs text-gray-600 font-mono">id:${escHtml(msg.tool_call_id)}</span>`;
  html += `</div>`;

  if (inner) {
    const detailsId = `msg-${Math.random().toString(36).slice(2, 9)}`;
    if (preview) {
      html += `<details class="message-details" id="${detailsId}">`;
      html += `<summary class="text-sm text-gray-300 font-mono bg-gray-800/40 rounded px-2 py-0.5 mb-2 select-none">${escHtml(preview)}</summary>`;
      html += `<div>`;
      html += inner;
      html += `</div></details>`;
    } else {
      html += inner;
    }
  }

  html += `</div>`;
  return html;
}

// ── Session Detail ───────────────────────────────────────────

function renderSessionDetail(session, msgs, rawReq) {
  if (!session) {
    return '<div class="text-gray-500 text-center mt-32 text-sm">No session data.</div>';
  }

  const toolsHash = session.tools_hash;
  const modelBadge = session.model
    ? `<span class="text-xs text-indigo-300 font-mono">${escHtml(session.model)}</span>`
    : '';
  const attributionBadge = (session.provider || session.user || session.project)
    ? `<span class="text-xs text-teal-400 font-mono" title="${escAttr(session.project || '')}">${
        [session.provider ? escHtml(session.provider) : '', session.user ? escHtml(session.user) : '', session.project ? escHtml(session.project) : ''].filter(Boolean).join(' · ')
      }</span>`
    : '';
  let html = `<div class="mb-6">
    <div class="flex flex-wrap items-center gap-3 mb-2">
      <span class="font-mono text-xs text-gray-500">${escHtml(session.id)}</span>
      <span class="text-xs px-2 py-0.5 rounded bg-emerald-900/50 text-emerald-300 border border-emerald-700">compact</span>
      ${modelBadge}
      ${attributionBadge}
      <span class="text-xs text-gray-400">${fmtDate(session.created_at)}</span>
      <span class="text-xs text-gray-500">${msgs ? msgs.length : 0} message(s)</span>
    </div>`;

  // Curl section
  if (rawReq) {
    const curlId = 'curl-body-' + session.id.slice(0, 8);
    const curlCmd = buildCurlCommand(rawReq);
    html += `
      <details class="mt-2 bg-gray-900 rounded border border-gray-700">
        <summary class="flex items-center justify-between px-4 py-2 text-sm text-gray-300 hover:text-white cursor-pointer">
          <span class="font-mono text-green-400">$ curl</span>
          <span class="text-gray-600 text-xs">▾</span>
        </summary>
        <div class="p-4 border-t border-gray-700">
          <div class="flex justify-end mb-2">
            <button onclick="copyToClipboard(this, '${curlId}')" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-400 px-2 py-1 rounded border border-gray-600">Copy</button>
          </div>
          <pre id="${curlId}" class="json-block text-green-300 bg-gray-950 p-3 rounded overflow-x-auto text-xs">${escHtml(curlCmd)}</pre>
        </div>
      </details>`;
  }

  // Observation summary
  if (session.summary) {
    html += `<div class="mt-2 bg-gray-900 rounded p-3 border border-indigo-900/60">
      <div class="text-xs text-indigo-400 font-semibold mb-1">Observation</div>
      <div class="text-sm text-gray-300 whitespace-pre-wrap break-words">${escHtml(session.summary)}</div>
    </div>`;
  }

  // Tools section (expandable gear icon)
  if (toolsHash) {
    html += `
      <details class="mt-3 bg-gray-900 rounded border border-gray-700" id="tools-detail">
        <summary class="flex items-center justify-between px-4 py-2 text-sm text-gray-300 hover:text-white cursor-pointer">
          <span>⚙ Tools <span class="text-gray-600 font-mono">${escHtml(toolsHash.slice(0, 8))}…</span></span>
          <span class="text-gray-600 text-xs">▾</span>
        </summary>
        <div class="p-4 border-t border-gray-700">
          <pre id="tools-body" class="json-block text-amber-300 bg-gray-950 p-3 rounded overflow-x-auto text-xs"></pre>
        </div>
      </details>`;
  }

  html += `</div>`;

  // Messages: last message expanded, rest grouped in collapsible "Input messages"
  if (msgs && msgs.length > 0) {
    const lastIdx = msgs.length - 1;

    // Input messages (all except the last)
    if (msgs.length > 1) {
      html += `
        <details class="mb-3 bg-gray-900 rounded border border-gray-700">
          <summary class="flex items-center justify-between px-4 py-2 text-sm text-gray-300 hover:text-white cursor-pointer">
            <span>Input messages <span class="text-gray-600">(${msgs.length - 1})</span></span>
            <span class="text-gray-600 text-xs">▾</span>
          </summary>
          <div class="px-4 pb-4 pt-2 space-y-2">`;
      for (let i = 0; i < lastIdx; i++) {
        let parsed = null;
        try { parsed = JSON.parse(msgs[i].body); } catch { parsed = null; }
        const dur = (msgs[i].duration_ms || 0) > 0 ? `<span class="text-xs text-gray-500">${fmtDuration(msgs[i].duration_ms)}</span>` : '';
        html += `
          <div class="bg-gray-800/60 rounded border border-gray-700">
            <div class="flex items-center gap-2 px-3 py-2 border-b border-gray-700">
              <span class="text-xs font-semibold text-gray-400">#${i+1}</span>
              <span class="font-mono text-xs text-gray-500">${escHtml(msgs[i].message_hash.slice(0, 12))}…</span>
              ${dur}
              <span class="ml-auto text-xs text-gray-600">${fmtTime(msgs[i].created_at)}</span>
            </div>
            <div class="px-3 pb-3 pt-2">
              ${parsed ? renderMessage(parsed) : '<span class="text-gray-600 text-xs">parse error</span>'}
            </div>
          </div>`;
      }
      html += `</div></details>`;
    }

    // Last message (expanded by default)
    let lastParsed = null;
    try { lastParsed = JSON.parse(msgs[lastIdx].body); } catch { lastParsed = null; }
    const lastDur = (msgs[lastIdx].duration_ms || 0) > 0
      ? `<span class="text-xs text-green-400">${fmtDuration(msgs[lastIdx].duration_ms)}</span>`
      : '';
    html += `
      <div class="bg-gray-900 rounded border border-gray-700">
        <div class="flex items-center gap-2 px-4 py-3 border-b border-gray-700">
          <span class="text-xs font-semibold text-gray-400">#${lastIdx+1}</span>
          <span class="font-mono text-xs text-gray-500">${escHtml(msgs[lastIdx].message_hash.slice(0, 12))}…</span>
          ${lastDur}
          <span class="ml-auto text-xs text-gray-600">${fmtTime(msgs[lastIdx].created_at)}</span>
        </div>
        <div class="px-4 pb-4 pt-2">
          ${lastParsed ? renderMessage(lastParsed) : '<span class="text-gray-600 text-xs">parse error</span>'}
        </div>
      </div>`;
  } else {
    html += `<div class="text-gray-600 text-xs text-center">No messages in this session.</div>`;
  }

  return html;
}

// Post-render: fetch tools body for the tools section.
function loadToolsBody(toolsHash) {
  if (!toolsHash) return;
  const pre = document.getElementById('tools-body');
  if (!pre) return;
  fetch(`/api/tools/${escHtml(toolsHash)}`)
    .then(r => r.json())
    .then(tools => { pre.textContent = JSON.stringify(tools, null, 2); })
    .catch(() => { pre.textContent = 'Failed to load tools'; });
}

// ── List Rendering ──────────────────────────────────────────

function renderSessionsList(sessions) {
  if (sessions.length === 0) {
    return `<div class="p-4 text-xs text-gray-600 text-center">No sessions yet.</div>`;
  }
  return sessions.map(s => {
    const isSelected = s.id === selectedId;
    const sel = isSelected ? 'bg-indigo-900/40 border-indigo-500' : 'border-transparent hover:bg-gray-800/50';
    const fmtClass = s.format === 'anthropic' ? 'text-purple-400' : 'text-cyan-400';
    const toolsBadge = s.tools_hash
      ? `<span class="text-xs text-amber-400">⚙</span>`
      : '';
    const tokenBadge = s.token_count > 0
      ? `<span class="text-xs text-gray-500">${(s.token_count / 1000).toFixed(1)}k tok</span>`
      : '';
    const modelLine = s.model
      ? `<div class="text-xs text-indigo-300 font-mono truncate">${escHtml(s.model)}</div>`
      : '';
    const summary = s.summary
      ? `<div class="text-xs text-gray-400 truncate mt-0.5" title="${escAttr(s.summary)}">${escHtml(s.summary.slice(0, 120))}</div>`
      : '';
    const attribution = (s.provider || s.user || s.project)
      ? `<div class="text-xs text-teal-600 truncate mt-0.5" title="${escAttr([s.provider, s.user, s.project].filter(Boolean).join(' · '))}">${
          [s.provider ? escHtml(s.provider) : '', s.user ? escHtml(s.user) : '', s.project ? escHtml(baseName(s.project)) : ''].filter(Boolean).join(' · ')
        }</div>`
      : '';
    return `
      <div class="px-3 py-2 border-l-2 cursor-pointer ${sel} transition-colors"
           onclick="selectSession('${escHtml(s.id)}')">
        <div class="flex items-center justify-between">
          <span class="flex items-center gap-1">
            <span class="text-xs ${fmtClass}">${escHtml(s.format || 'unknown')}</span>
            ${toolsBadge}
            ${tokenBadge}
          </span>
          <span class="text-xs text-gray-500">${s.message_count} msg(s)</span>
        </div>
        ${modelLine}
        <div class="flex items-center justify-between mt-0.5">
          <span class="text-xs text-gray-600 font-mono">${escHtml(s.id.slice(0,8))}…</span>
          <span class="flex items-center gap-1">
            <span class="text-xs text-gray-400">${fmtTime(s.created_at)}</span>
            ${s.last_duration_ms ? `<span class="text-xs text-green-400">${fmtDuration(s.last_duration_ms)}</span>` : ''}
          </span>
        </div>
        ${attribution}
        ${summary}
      </div>`;
  }).join('');
}

// ── Actions ──────────────────────────────────────────────────

async function loadSessionsList() {
  try {
    allSessions = await fetchSessionsList();
    document.getElementById('request-list').innerHTML = renderSessionsList(allSessions);
    setStatus(true);
  } catch (e) {
    setStatus(false);
  }
}

async function selectSession(id) {
  selectedId = id;
  document.getElementById('request-list').innerHTML = renderSessionsList(allSessions);
  document.getElementById('detail-panel').innerHTML = '<div class="text-gray-500 text-sm text-center mt-32">Loading…</div>';
  try {
    const [data, rawReq] = await Promise.all([
      fetchSessionDetail(id),
      fetchRawRequest(id),
    ]);
    document.getElementById('detail-panel').innerHTML = renderSessionDetail(data.session, data.messages, rawReq);
    loadToolsBody(data.session.tools_hash);
  } catch (e) {
    console.error(e);
    document.getElementById('detail-panel').innerHTML = '<div class="text-red-400 text-sm text-center mt-32">Failed to load session.</div>';
  }
}

// ── Clipboard ───────────────────────────────────────────────

function copyToClipboard(btn, elementId) {
  const text = document.getElementById(elementId)?.textContent || '';
  if (!text) return;

  const performCopy = async () => {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.left = "-9999px";
    textArea.style.top = "0";
    document.body.appendChild(textArea);
    textArea.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(textArea);
    return ok;
  };

  performCopy().then(ok => {
    if (ok) {
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = orig; }, 1500);
    }
  }).catch(err => console.error('Copy failed:', err));
}

// ── Scroll to top ────────────────────────────────────────────

function scrollToTop() {
  document.getElementById('detail-panel').scrollTo({ top: 0, behavior: 'smooth' });
}

function setupScrollToTop() {
  const btn = document.getElementById('scroll-to-top');
  const panel = document.getElementById('detail-panel');
  panel.addEventListener('scroll', () => {
    if (panel.scrollTop > 300) {
      btn.classList.add('visible');
    } else {
      btn.classList.remove('visible');
    }
  }, { passive: true });
}

// ── Status & Refresh ─────────────────────────────────────────

function setStatus(ok) {
  const dot = document.getElementById('status-dot');
  dot.className = `w-2 h-2 rounded-full ${ok ? 'bg-green-500' : 'bg-red-500'}`;
}

function setupAutoRefresh() {
  const cb = document.getElementById('auto-refresh');
  cb.addEventListener('change', () => {
    if (cb.checked) {
      refreshTimer = setInterval(loadSessionsList, 5000);
    } else {
      clearInterval(refreshTimer);
      refreshTimer = null;
    }
  });
}

// ── Utilities ────────────────────────────────────────────────

function escHtml(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function escAttr(s) {
  return String(s ?? '').replace(/"/g,'\\"');
}

function baseName(path) {
  if (!path) return '';
  const parts = path.split('/').filter(Boolean);
  return parts.length ? parts[parts.length - 1] : path;
}

// ── Init ─────────────────────────────────────────────────────

document.getElementById('refresh-btn').addEventListener('click', loadSessionsList);

setupAutoRefresh();
setupScrollToTop();
loadSessionsList();
</script>
