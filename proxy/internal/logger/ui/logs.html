<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.3/lib/marked.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.2/dist/purify.min.js" defer></script>
  <style>
    .role-system   { background:#374151; color:#d1d5db; }
    .role-user     { background:#1e40af; color:#bfdbfe; }
    .role-assistant{ background:#065f46; color:#6ee7b7; }
    .role-tool     { background:#78350f; color:#fde68a; }
    .json-block    { white-space:pre-wrap; word-break:break-all; font-family:monospace; font-size:0.75rem; }
    .reasoning-block { border-left:3px solid #6366f1; padding-left:0.75rem; color:#a5b4fc; font-style:italic; }
    details > summary { cursor:pointer; user-select:none; }
    details > summary::-webkit-details-marker { display:none; }
    /* dark-mode markdown styling */
    .md-content   { color:#e5e7eb; font-size:0.875rem; line-height:1.7; }
    .md-content p { margin:0.25rem 0; }
    .md-content code { background:#1f2937; padding:0.1rem 0.3rem; border-radius:4px; font-size:0.8rem; font-family:ui-monospace,monospace; }
    .md-content pre { background:#1f2937; padding:0.75rem 1rem; border-radius:6px; overflow-x:auto; }
    .md-content pre code { background:transparent; padding:0; font-size:0.75rem; color:#e5e7eb; }
    .md-content table { border-collapse:collapse; }
    .md-content th, .md-content td { border:1px solid #374151; padding:0.3rem 0.6rem; }
    .md-content th { background:#1f2937; font-weight:600; }
    .md-content blockquote { border-left:3px solid #4b5563; padding-left:0.75rem; color:#9ca3af; }
    .md-content a { color:#60a5fa; text-decoration:underline; }
    .md-content h1,.md-content h2,.md-content h3,.md-content h4 { color:#f9fafb; margin:0.5rem 0 0.25rem; font-weight:600; }
    .md-content hr { border-color:#374151; margin:0.5rem 0; }
    .md-content ul,.md-content ol { padding-left:1.5rem; margin:0.25rem 0; }
    .md-content li { margin:0.1rem 0; }
  </style>
</head>
<body class="bg-gray-950 text-gray-200 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-gray-900 border-b border-gray-700 px-5 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <span class="text-lg font-semibold text-white">Agent Logs</span>
      <span id="status-dot" class="w-2 h-2 rounded-full bg-gray-500"></span>
    </div>
    <div class="flex items-center gap-3">
      <!-- View Toggle -->
      <div class="flex items-center bg-gray-800 rounded-lg p-0.5 border border-gray-600">
        <button id="view-logs" class="px-3 py-1.5 text-sm rounded-md transition-colors bg-indigo-600 text-white" onclick="switchView('logs')">Logs</button>
        <button id="view-sessions" class="px-3 py-1.5 text-sm rounded-md transition-colors text-gray-400 hover:text-gray-200" onclick="switchView('sessions')">Sessions</button>
      </div>
      <label class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer">
        <input type="checkbox" id="auto-refresh" class="accent-indigo-500"> Auto-refresh
      </label>
      <button id="refresh-btn" class="text-sm bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded border border-gray-600">
        ↻ Refresh
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex flex-1 min-h-0">

    <!-- Left: list -->
    <aside class="w-72 shrink-0 border-r border-gray-700 bg-gray-900 flex flex-col">
      <div class="px-3 py-2 text-xs text-gray-500 border-b border-gray-700 font-medium uppercase tracking-wide" id="list-header">Requests</div>
      <div id="request-list" class="overflow-y-auto flex-1"></div>
    </aside>

    <!-- Right: detail -->
    <section class="flex-1 overflow-y-auto p-6 bg-gray-950" id="detail-panel">
      <div class="text-gray-500 text-center mt-32 text-sm">Select an item from the list to inspect it.</div>
    </section>

  </main>

<script>
let selectedId = null;
let allLogs = [];
let allSessions = [];
let refreshTimer = null;
let currentView = 'logs';

// ── Markdown renderer ────────────────────────────────────────

let _renderMarkdownFn = null;

function renderMarkdown(text) {
  if (!_renderMarkdownFn) {
    if (typeof marked === 'undefined') {
      _renderMarkdownFn = function(t) { return t ? '<p class="text-sm text-gray-300 mt-1 whitespace-pre-wrap break-words">' + escHtml(t) + '</p>' : ''; };
    } else {
      marked.setOptions({ breaks: true, gfm: true, headerIds: false });
      var sanitizer = typeof DOMPurify !== 'undefined' ? DOMPurify : null;
      _renderMarkdownFn = function(text) {
        if (!text) return '';
        var raw = marked.parse(String(text));
        try { return sanitizer ? sanitizer.sanitize(raw) : raw; } catch { return raw; }
      };
    }
  }
  return _renderMarkdownFn(text);
}

// ── View switching ───────────────────────────────────────────

function switchView(view) {
  currentView = view;
  const logsBtn = document.getElementById('view-logs');
  const sessionsBtn = document.getElementById('view-sessions');
  const listHeader = document.getElementById('list-header');

  if (view === 'logs') {
    logsBtn.className = 'px-3 py-1.5 text-sm rounded-md transition-colors bg-indigo-600 text-white';
    sessionsBtn.className = 'px-3 py-1.5 text-sm rounded-md transition-colors text-gray-400 hover:text-gray-200';
    listHeader.textContent = 'Requests';
  } else {
    sessionsBtn.className = 'px-3 py-1.5 text-sm rounded-md transition-colors bg-indigo-600 text-white';
    logsBtn.className = 'px-3 py-1.5 text-sm rounded-md transition-colors text-gray-400 hover:text-gray-200';
    listHeader.textContent = 'Sessions';
  }

  selectedId = null;
  if (view === 'logs') {
    loadLogsList();
  } else {
    loadSessionsList();
  }
}

// ── Fetch helpers (old logs) ─────────────────────────────────

async function fetchLogsList() {
  const res = await fetch('/api/logs');
  if (!res.ok) throw new Error('fetch logs list failed');
  return res.json();
}

async function fetchLogsDetail(id) {
  const res = await fetch(`/api/logs/${id}`);
  if (!res.ok) throw new Error('fetch logs detail failed');
  return res.json();
}

// ── Fetch helpers (new sessions) ─────────────────────────────

async function fetchSessionsList() {
  const res = await fetch('/api/sessions');
  if (!res.ok) throw new Error('fetch sessions list failed');
  return res.json();
}

async function fetchSessionDetail(id) {
  const res = await fetch(`/api/sessions/${id}`);
  if (!res.ok) throw new Error('fetch session detail failed');
  return res.json();
}

// ── Rendering ────────────────────────────────────────────────

function fmtDuration(ms) {
  if (ms < 1000) return `${ms}ms`;
  return `${(ms / 1000).toFixed(1)}s`;
}

function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' ' + fmtTime(iso);
}

function roleBadge(role) {
  const cls = `role-${role}`;
  return `<span class="inline-block text-xs font-mono px-2 py-0.5 rounded ${cls}">${role}</span>`;
}

function renderContent(content, enableMarkdown) {
  if (content === null || content === undefined || content === '') return '';
  if (typeof content === 'string') {
    const renderedContent = enableMarkdown === true ? renderMarkdown(escHtml(content)) : escHtml(content);
    return `<div class="md-content whitespace-pre-wrap test-foo">${renderedContent}</div>`;
  }
  if (Array.isArray(content)) {
    return content.map(b => {
      if (b.type === 'text') {
        const renderedContent = enableMarkdown === true ? renderMarkdown(escHtml(b.text) || '') : escHtml(b.text) || '';
        return `<div class="md-content whitespace-pre-wrap test-bar">${renderedContent}</div>`
      };
      return `<p class="text-xs text-gray-500 mt-1">[${b.type}]</p>`;
    }).join('');
  }
  return `<pre class="json-block text-gray-400 mt-1">${escHtml(JSON.stringify(content, null, 2))}</pre>`;
}

function renderToolCalls(toolCalls) {
  if (!toolCalls || toolCalls.length === 0) return '';
  return toolCalls.map(tc => {
    let args = tc.function?.arguments || '';
    try { args = JSON.stringify(JSON.parse(args), null, 2); } catch {}
    const idLabel = tc.id ? `<span class="text-gray-600 font-mono ml-2">${escHtml(tc.id)}</span>` : '';
    return `
      <div class="mt-1 bg-gray-800 rounded p-2 border border-amber-800/40">
        <div class="flex items-center gap-1 text-xs font-mono text-amber-400">⚙ ${escHtml(tc.function?.name || '')}${idLabel}</div>
        <pre class="json-block text-gray-400 mt-1">${escHtml(args)}</pre>
      </div>`;
  }).join('');
}

function renderMessage(msg) {
  const role = msg.role || 'unknown';
  const enableMarkdown = role !== 'tool';

  let inner = '';
  if (msg.reasoning) {
    inner += `<div class="reasoning-block text-xs mt-1 mb-2">
      <div class="text-indigo-400 text-xs font-semibold mb-1">Reasoning</div>
      <div class="whitespace-pre-wrap break-words">${renderMarkdown(msg.reasoning, enableMarkdown)}</div>
    </div>`;
  }
  inner += renderContent(msg.content, enableMarkdown);
  inner += renderToolCalls(msg.tool_calls);
  inner = inner.trim();

  let preview = '';
  if (inner) {
    const tmp = document.createElement('div');
    tmp.innerHTML = inner;
    const text = (tmp.textContent || '').replace(/\s+/g, ' ').trim();
    preview = text.slice(0, 250);
    if (text.length > 250) preview += '…';
  }

  let html = `<div class="mb-3 p-3 bg-gray-800/60 rounded border border-gray-700">`;
  html += `<div class="flex items-center gap-2 mb-1">${roleBadge(role)}`;
  if (msg.name) html += `<span class="text-xs text-gray-500 font-mono">${escHtml(msg.name)}</span>`;
  if (msg.tool_call_id) html += `<span class="text-xs text-gray-600 font-mono">id:${escHtml(msg.tool_call_id)}</span>`;
  html += `</div>`;

  if (inner) {
    const detailsId = `msg-${Math.random().toString(36).slice(2, 9)}`;
    if (preview) {
      html += `<details class="message-details" id="${detailsId}">`;
      html += `<summary class="text-sm text-gray-300 font-mono bg-gray-800/40 rounded px-2 py-0.5 mb-2 select-none">${escHtml(preview)}</summary>`;
      html += `<div>`;
      html += inner;
      html += `</div></details>`;
    } else {
      html += inner;
    }
  }

  html += `</div>`;
  return html;
}

function renderOutputLog(output) {
  if (!output) return '<span class="text-gray-600 text-xs">empty</span>';
  let html = '';
  if (output.reasoning) {
    html += `<div class="reasoning-block text-xs mb-2">
      <div class="text-indigo-400 text-xs font-semibold mb-1">Reasoning</div>
      <div class="whitespace-pre-wrap break-words">${renderMarkdown(output.reasoning)}</div>
    </div>`;
  }
  if (output.content) {
    html += `<div class="md-content">${renderMarkdown(output.content)}</div>`;
  }
  if (output.tool_calls && output.tool_calls.length > 0) {
    html += `<div class="mt-2">
      <div class="text-amber-400 text-xs font-semibold mb-1">Tool Calls</div>
      ${renderToolCalls(output.tool_calls)}
    </div>`;
  }
  if (!output.reasoning && !output.content && (!output.tool_calls || !output.tool_calls.length)) {
    html = '<span class="text-gray-600 text-xs">empty</span>';
  }
  return html;
}

function buildCurlCommand(log) {
  const host = window.location.host;
  const parts = [`curl -X POST http://${host}${log.request_path}`];
  for (const [k, v] of Object.entries(log.request_headers || {})) {
    parts.push(`  -H "${escAttr(k)}: ${escAttr(v)}"`);
  }
  const body = log.request_body
    ? JSON.stringify(log.request_body, null, 2)
    : '{}';
  parts.push(`  -d '${body.replace(/'/g, "'\\''")}'`);
  return parts.join(' \\\n');
}

// ── Old Log Detail ───────────────────────────────────────────

function renderLogDetail(log) {
  const curlCmd = buildCurlCommand(log);

  let html = `
    <div class="mb-6">
      <div class="flex flex-wrap items-center gap-3 mb-2">
        <span class="font-mono text-xs text-gray-500">${escHtml(log.id)}</span>
        <span class="text-xs px-2 py-0.5 rounded bg-indigo-900/50 text-indigo-300 border border-indigo-700">${escHtml(log.format)}</span>
        <span class="text-xs text-gray-400">${fmtDate(log.started_at)}</span>
        <span class="text-xs text-gray-400">${fmtDuration(log.duration_ms)}</span>
        <span class="text-xs text-gray-500">${(log.calls||[]).length} call(s)</span>
      </div>

      <!-- Curl replay -->
      <details class="mt-3 bg-gray-900 rounded border border-gray-700">
        <summary class="flex items-center justify-between px-4 py-2 text-sm text-gray-300 hover:text-white">
          <span>↺ Replay with curl</span>
          <span class="text-gray-600 text-xs">▾</span>
        </summary>
        <div class="p-4 border-t border-gray-700">
          <div class="flex justify-end mb-2">
            <button onclick="copyToClipboard(this, 'curl-${escHtml(log.id)}')"
              class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-400 px-2 py-1 rounded border border-gray-600">
              Copy
            </button>
          </div>
          <pre id="curl-${escHtml(log.id)}" class="json-block text-green-400 bg-gray-950 p-3 rounded overflow-x-auto">${escHtml(curlCmd)}</pre>
        </div>
      </details>
    </div>

    <div class="space-y-4">`;

  (log.calls || []).forEach((call, i) => {
    const kindColor = call.node_kind === 'route' ? 'text-cyan-400' : call.node_kind === 'proxy' ? 'text-emerald-400' : 'text-purple-400';
    const iterLabel = call.node_kind === 'chain' && call.iteration > 0
      ? ` <span class="text-gray-500 text-xs">iter ${call.iteration}</span>` : '';

    html += `
      <div class="bg-gray-900 rounded border border-gray-700">
        <div class="flex items-center gap-2 px-4 py-3 border-b border-gray-700">
          <span class="text-xs font-semibold text-gray-400">#${i+1}</span>
          <span class="font-mono text-sm text-white">${escHtml(call.node_id)}</span>
          <span class="text-xs ${kindColor}">${escHtml(call.node_kind)}</span>
          ${iterLabel}
          <span class="ml-auto text-xs text-gray-600">${fmtTime(call.timestamp)}</span>
        </div>

        <!-- Input messages -->
        <details class="border-b border-gray-700">
          <summary class="flex items-center justify-between px-4 py-2 text-xs text-gray-400 hover:text-gray-200">
            <span>Input messages <span class="text-gray-600">(${(call.input||[]).length})</span></span>
            <span class="text-gray-600">▾</span>
          </summary>
          <div class="px-4 pb-4 pt-2">
            ${(call.input || []).map(renderMessage).join('') || '<span class="text-gray-600 text-xs">none</span>'}
          </div>
        </details>

        <!-- Output -->
        <div class="px-4 py-3">
          <div class="text-xs text-gray-500 font-semibold uppercase tracking-wide mb-2">Output</div>
          ${renderOutputLog(call.output)}
        </div>
      </div>`;
  });

  html += `</div>`;
  return html;
}

// ── New Session Detail ───────────────────────────────────────

function renderSessionDetail(msgs) {
  if (!msgs || msgs.length === 0) {
    return '<div class="text-gray-500 text-center mt-32 text-sm">No messages in this session.</div>';
  }

  let html = `<div class="mb-6">
    <div class="flex flex-wrap items-center gap-3 mb-2">
      <span class="font-mono text-xs text-gray-500">${escHtml(msgs[0].hash)}</span>
      <span class="text-xs px-2 py-0.5 rounded bg-emerald-900/50 text-emerald-300 border border-emerald-700">compact</span>
      <span class="text-xs text-gray-400">${fmtDate(msgs[0].created_at)}</span>
      <span class="text-xs text-gray-500">${msgs.length} message(s)</span>
    </div>
  </div>`;

  html += `<div class="space-y-2">`;

  msgs.forEach((msg, i) => {
    // Parse the body — it's a JSON array of messages
    let parsed = [];
    try {
      parsed = JSON.parse(msg.body);
    } catch {
      parsed = [];
    }

    const toolsLabel = msg.tools_hash
      ? `<span class="text-xs text-amber-400">⚙ tools: ${escHtml(msg.tools_hash.slice(0, 8))}…</span>`
      : '';

    html += `
      <div class="bg-gray-900 rounded border border-gray-700">
        <div class="flex items-center gap-2 px-4 py-3 border-b border-gray-700">
          <span class="text-xs font-semibold text-gray-400">#${i+1}</span>
          <span class="font-mono text-xs text-gray-500">${escHtml(msg.hash.slice(0, 12))}…</span>
          ${toolsLabel}
          <span class="ml-auto text-xs text-gray-600">${fmtTime(msg.created_at)}</span>
        </div>
        <div class="px-4 pb-4 pt-2">
          ${parsed.map(renderMessage).join('') || '<span class="text-gray-600 text-xs">parse error</span>'}
        </div>
      </div>`;
  });

  html += `</div>`;
  return html;
}

// ── List Rendering ──────────────────────────────────────────

function renderLogsList(logs) {
  if (logs.length === 0) {
    return `<div class="p-4 text-xs text-gray-600 text-center">No logs yet.</div>`;
  }
  return logs.map(log => {
    const isSelected = log.id === selectedId;
    const sel = isSelected ? 'bg-indigo-900/40 border-indigo-500' : 'border-transparent hover:bg-gray-800/50';
    const fmtBadge = log.format === 'anthropic'
      ? '<span class="text-xs text-purple-400">anthropic</span>'
      : '<span class="text-xs text-cyan-400">openai</span>';
    return `
      <div class="px-3 py-2 border-l-2 cursor-pointer ${sel} transition-colors"
           onclick="selectLogsLog('${escHtml(log.id)}')">
        <div class="flex items-center justify-between">
          ${fmtBadge}
          <span class="text-xs text-gray-500">${fmtDuration(log.duration_ms)}</span>
        </div>
        <div class="text-xs text-gray-400 mt-0.5">${fmtTime(log.started_at)}</div>
        <div class="text-xs text-gray-600 mt-0.5 font-mono">${escHtml(log.id.slice(0,8))}…</div>
      </div>`;
  }).join('');
}

function renderSessionsList(sessions) {
  if (sessions.length === 0) {
    return `<div class="p-4 text-xs text-gray-600 text-center">No sessions yet.</div>`;
  }
  return sessions.map(s => {
    const isSelected = s.id === selectedId;
    const sel = isSelected ? 'bg-indigo-900/40 border-indigo-500' : 'border-transparent hover:bg-gray-800/50';
    return `
      <div class="px-3 py-2 border-l-2 cursor-pointer ${sel} transition-colors"
           onclick="selectSession('${escHtml(s.id)}')">
        <div class="flex items-center justify-between">
          <span class="text-xs text-emerald-400">session</span>
          <span class="text-xs text-gray-500">${s.message_count} msg(s)</span>
        </div>
        <div class="text-xs text-gray-400 mt-0.5">${fmtTime(s.created_at)}</div>
        <div class="text-xs text-gray-600 mt-0.5 font-mono">${escHtml(s.id.slice(0,8))}…</div>
      </div>`;
  }).join('');
}

// ── Actions (old logs) ─────────────────────────────────────

async function loadLogsList() {
  try {
    allLogs = await fetchLogsList();
    document.getElementById('request-list').innerHTML = renderLogsList(allLogs);
    setStatus(true);
  } catch (e) {
    setStatus(false);
  }
}

async function selectLogsLog(id) {
  selectedId = id;
  document.getElementById('request-list').innerHTML = renderLogsList(allLogs);
  document.getElementById('detail-panel').innerHTML = '<div class="text-gray-500 text-sm text-center mt-32">Loading…</div>';
  try {
    const log = await fetchLogsDetail(id);
    document.getElementById('detail-panel').innerHTML = renderLogDetail(log);
  } catch (e) {
    document.getElementById('detail-panel').innerHTML = '<div class="text-red-400 text-sm text-center mt-32">Failed to load log.</div>';
  }
}

// ── Actions (new sessions) ───────────────────────────────────

async function loadSessionsList() {
  try {
    allSessions = await fetchSessionsList();
    document.getElementById('request-list').innerHTML = renderSessionsList(allSessions);
    setStatus(true);
  } catch (e) {
    setStatus(false);
  }
}

async function selectSession(id) {
  selectedId = id;
  document.getElementById('request-list').innerHTML = renderSessionsList(allSessions);
  document.getElementById('detail-panel').innerHTML = '<div class="text-gray-500 text-sm text-center mt-32">Loading…</div>';
  try {
    const msgs = await fetchSessionDetail(id);
    document.getElementById('detail-panel').innerHTML = renderSessionDetail(msgs);
  } catch (e) {
    document.getElementById('detail-panel').innerHTML = '<div class="text-red-400 text-sm text-center mt-32">Failed to load session.</div>';
  }
}

// ── Clipboard ───────────────────────────────────────────────

function copyToClipboard(btn, elementId) {
  const text = document.getElementById(elementId)?.textContent || '';
  if (!text) return;

  const performCopy = async () => {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.left = "-9999px";
    textArea.style.top = "0";
    document.body.appendChild(textArea);
    textArea.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(textArea);
    return ok;
  };

  performCopy().then(ok => {
    if (ok) {
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = orig; }, 1500);
    }
  }).catch(err => console.error('Copy failed:', err));
}

// ── Status & Refresh ─────────────────────────────────────────

function setStatus(ok) {
  const dot = document.getElementById('status-dot');
  dot.className = `w-2 h-2 rounded-full ${ok ? 'bg-green-500' : 'bg-red-500'}`;
}

function setupAutoRefresh() {
  const cb = document.getElementById('auto-refresh');
  cb.addEventListener('change', () => {
    if (cb.checked) {
      refreshTimer = setInterval(() => {
        if (currentView === 'logs') {
          loadLogsList();
        } else {
          loadSessionsList();
        }
      }, 5000);
    } else {
      clearInterval(refreshTimer);
      refreshTimer = null;
    }
  });
}

// ── Utilities ────────────────────────────────────────────────

function escHtml(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function escAttr(s) {
  return String(s ?? '').replace(/"/g,'\\"');
}

// ── Init ─────────────────────────────────────────────────────

document.getElementById('refresh-btn').addEventListener('click', () => {
  if (currentView === 'logs') {
    loadLogsList();
  } else {
    loadSessionsList();
  }
});

setupAutoRefresh();
loadLogsList();
</script>
</body>
</html>
